name: gezi_mobile
description: "鸽子下载 - 夸克网盘下载器 (Flutter)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 路径：下载目录 / 应用文档目录
  path_provider: ^2.1.4
  # 路径拼接与跨平台处理
  path: ^1.9.0
  # 状态管理：轻量、零 codegen，够用且易测
  provider: ^6.1.2
  # 打开已下载的文件（任务页「打开」按钮）
  open_filex: ^4.5.0
  # 剪贴板读取（粘贴分享链接）
  # 直接用 flutter/services 的 Clipboard，无需额外依赖
  #
  # 【刻意不引入 package_info_plus】
  # 它 8.x 把 sourceCompatibility 定死成 Java 17，而 AGP 7.3 + JDK 11 的
  # 构建环境编不过（"无效的源发行版: 17"）。本项目只在设置页显示版本号，
  # 硬编码在代码里即可，不值得为一行字把整条工具链抬到 JDK 17。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
